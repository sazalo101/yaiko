[package]
name = "yaiko-core"
version = "0.1.0"
edition = "2021"
authors = ["Yaiko Team"]
description = "A modern, production-ready fullstack web framework for Rust"
license = "MIT"
repository = "https://github.com/sazalo101/yaiko"

keywords = ["web", "framework", "async", "fullstack", "yaiko"]
categories = ["web-programming::http-server"]

[features]
default = ["compression", "sessions", "templates", "static-files", "sqlite"]
compression = ["async-compression"]
sessions = ["cookie", "uuid"]
templates = ["handlebars"]
static-files = ["mime_guess"]
metrics = ["prometheus"]
postgres = []
sqlite = []
dev = []

[dependencies]
# Core dependencies
hyper = { version = "0.14", features = ["full"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.5"
percent-encoding = "2.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
config = "0.14"

# Error handling
thiserror = "1.0"

# Optional dependencies for features
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"], optional = true }
cookie = { version = "0.17", optional = true }
uuid = { version = "1.0", features = ["v4"], optional = true }
handlebars = { version = "4.0", optional = true }
mime_guess = { version = "2.0", optional = true }
prometheus = { version = "0.13", optional = true }

# Authentication and security
jsonwebtoken = "8.0"
bcrypt = "0.14"
chrono = { version = "0.4", features = ["serde"] }

# Database support
sqlx = { version = "0.7", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono"] }
redis = { version = "0.23", features = ["tokio-comp"] }

# File upload support
multer = "2.0"

# WebSocket support
sha1_smol = "1.0"
base64 = "0.21"
notify = "6.0"
walkdir = "2.5.0"
futures = "0.3.32"
tokio-util = { version = "0.7.18", features = ["io"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
