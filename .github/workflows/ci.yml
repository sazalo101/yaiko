name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  feature-matrix:
    name: yaiko-core / ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: test
          - name: sqlite
            args: test --no-default-features --features sqlite
          - name: postgres
            args: test --no-default-features --features postgres
          - name: sqlite-postgres
            args: test --no-default-features --features sqlite,postgres
          - name: metrics
            args: test --no-default-features --features metrics
          - name: development
            args: check --no-default-features --features dev,sqlite
          - name: all-features
            args: test --all-features
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            yaiko/target/
          key: ${{ runner.os }}-yaiko-core-${{ matrix.name }}-${{ hashFiles('yaiko/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-yaiko-core-${{ matrix.name }}-
            ${{ runner.os }}-yaiko-core-

      - name: Run feature configuration
        run: cargo ${{ matrix.args }} --manifest-path yaiko/Cargo.toml

  quality:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Check core formatting
        run: cargo fmt --manifest-path yaiko/Cargo.toml -- --check

      - name: Check CLI formatting
        run: cargo fmt --manifest-path yaiko-cli/Cargo.toml -- --check

      - name: Run core clippy
        run: cargo clippy --manifest-path yaiko/Cargo.toml --all-features --all-targets -- -D warnings

      - name: Run CLI clippy
        run: cargo clippy --manifest-path yaiko-cli/Cargo.toml --all-targets -- -D warnings

  cli:
    name: CLI and scaffold
    runs-on: ubuntu-latest
    needs: [feature-matrix, quality]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build and test CLI
        run: |
          cargo build --manifest-path yaiko-cli/Cargo.toml
          cargo test --manifest-path yaiko-cli/Cargo.toml

      - name: Verify relative SQLite scaffold
        run: |
          cargo run --manifest-path yaiko-cli/Cargo.toml -- init ci-smoke-app --database sqlite
          cargo check --manifest-path ci-smoke-app/Cargo.toml

      - name: Verify absolute SQLite scaffold
        run: |
          rm -rf /tmp/yaiko-ci-smoke-app
          cargo run --manifest-path yaiko-cli/Cargo.toml -- init /tmp/yaiko-ci-smoke-app --database sqlite
          cargo check --manifest-path /tmp/yaiko-ci-smoke-app/Cargo.toml

  examples:
    name: representative examples
    runs-on: ubuntu-latest
    needs: [feature-matrix, quality]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Build representative examples
        run: |
          cargo build --manifest-path examples/blog/Cargo.toml
          cargo build --manifest-path examples/notes/Cargo.toml
          cargo build --manifest-path examples/chat/Cargo.toml
          cargo build --manifest-path examples/auth/Cargo.toml
          cargo build --manifest-path examples/link-in-bio/Cargo.toml
