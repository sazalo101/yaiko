name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-action@stable
      
    - name: Cache cargo
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        
    - name: Build yaiko-core
      run: cargo build --manifest-path yaiko/Cargo.toml
      
    - name: Run tests
      run: cargo test --manifest-path yaiko/Cargo.toml
      
    - name: Build CLI
      run: cargo build --manifest-path yaiko-cli/Cargo.toml

    - name: Verify generated scaffold
      run: |
        cargo run --manifest-path yaiko-cli/Cargo.toml -- init ci-smoke-app --database sqlite
        cargo check --manifest-path ci-smoke-app/Cargo.toml

    - name: Check formatting
      run: cargo fmt --manifest-path yaiko/Cargo.toml -- --check
      continue-on-error: true
      
    - name: Clippy
      run: cargo clippy --manifest-path yaiko/Cargo.toml -- -D warnings
      continue-on-error: true

  examples:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-action@stable
      
    - name: Build blog example
      run: cargo build --manifest-path examples/blog/Cargo.toml
      
    - name: Build notes example
      run: cargo build --manifest-path examples/notes/Cargo.toml
      
    - name: Build chat example
      run: cargo build --manifest-path examples/chat/Cargo.toml

    - name: Build auth example
      run: cargo build --manifest-path examples/auth/Cargo.toml

    - name: Build link-in-bio example
      run: cargo build --manifest-path examples/link-in-bio/Cargo.toml
