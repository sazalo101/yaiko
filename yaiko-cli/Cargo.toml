[package]
name = "yaiko"
version = "0.1.2"
edition = "2021"
authors = ["Yaiko Team"]
description = "A modern, production-ready fullstack framework for Rust + jQuery"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sazalo101/yaiko"
documentation = "https://github.com/sazalo101/yaiko#readme"

keywords = ["web", "framework", "cli", "fullstack"]

[[bin]]
name = "yaiko"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.0", features = ["derive"] }
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# File watching
notify = "6.0"
notify-debouncer-mini = "0.4"

# File operations
walkdir = "2.4"
include_dir = "0.7"

# Serialization
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Process management
which = "6.0"

# Colored output
colored = "2.1"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Date/time
chrono = "0.4"
dotenvy = "0.15"
sqlx = { version = "0.8.6", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono"] }
